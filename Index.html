<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ujian Online TKA</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;margin:0;padding:20px}.wrap{max-width:900px;margin:auto;background:#fff;border-radius:12px;padding:28px;box-shadow:0 10px 35px #0003}h1{text-align:center;color:#333;margin-top:0}.muted{color:#666;text-align:center}.section{display:none}.active{display:block}.form{max-width:420px;margin:30px auto}.form label{display:block;font-weight:bold;margin:15px 0 6px}.form input,.form textarea{width:100%;padding:12px;border:2px solid #ddd;border-radius:6px;font-size:16px}.form input{text-transform:uppercase}.btn{width:100%;padding:13px;border:0;border-radius:6px;background:#667eea;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.btn.green{background:#35a853}.error{background:#ffe1e1;color:#b00020;padding:12px;border-radius:6px;margin-top:15px}.top{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #ddd;padding-bottom:15px;margin-bottom:20px}.timer{color:#d22;font-weight:bold}.q{background:#f5f7fb;border-left:4px solid #667eea;padding:18px;margin:18px 0;border-radius:6px}.qtitle{font-weight:bold;margin-bottom:12px}.opt{display:block;background:#fff;border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:5px}.opt input{margin-right:8px}.table{width:100%;border-collapse:collapse;background:#fff}.table td,.table th{border:1px solid #ccc;padding:9px}.result{text-align:center}.score{font-size:48px;font-weight:bold;color:#667eea}@media(max-width:600px){.top{display:block}.timer{margin-top:10px}}
</style></head><body><main class="wrap"><h1>📝 Ujian Online TKA</h1><p class="muted">Masukkan nama dan kelas untuk mulai.</p>
<section id="login" class="section active"><div class="form"><label>Nama Lengkap</label><input id="name" type="text" placeholder="NAMA LENGKAP" autocomplete="off"><label>Kelas</label><input id="kelas" type="text" placeholder="CONTOH: XII IPA 1" autocomplete="off"><button class="btn" onclick="start()">Mulai Ujian</button><div id="loginError" class="error" hidden></div></div></section>
<section id="exam" class="section"><div class="top"><div><b id="showName"></b><br><span id="showClass"></span></div><div class="timer">⏱ <span id="timer">30:00</span></div></div><div id="questions"></div><button class="btn green" onclick="submitExam()">Selesaikan Ujian</button><div id="examError" class="error" hidden></div></section>
<section id="result" class="section result"><div class="score" id="score"></div><p id="message"></p><button class="btn" onclick="location.reload()">Kembali</button></section></main>
<script>
let questions=[],answers={},seconds=1800,timerId;
const $=id=>document.getElementById(id);
$('name').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());$('kelas').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase());
function error(id,msg){$(id).textContent=msg;$(id).hidden=false}
function start(){const name=$('name').value.trim().toUpperCase(),kelas=$('kelas').value.trim().toUpperCase();$('loginError').hidden=true;if(!name||!kelas)return error('loginError','Nama dan kelas wajib diisi.');google.script.run.withSuccessHandler(r=>{if(r.exists)return error('loginError',r.message);localStorage.setItem('examName',name);localStorage.setItem('examClass',kelas);$('showName').textContent=name;$('showClass').textContent='Kelas: '+kelas;$('login').classList.remove('active');$('exam').classList.add('active');google.script.run.withSuccessHandler(render).getQuestions();timerId=setInterval(tick,1000)}).withFailureHandler(e=>error('loginError',e.message||e)).checkStudentExists(name)}
function tick(){seconds--;let m=Math.floor(seconds/60),s=seconds%60;$('timer').textContent=m+':'+String(s).padStart(2,'0');if(seconds<=0){clearInterval(timerId);submitExam()}}
function render(data){if(data.error)return error('examError',data.error);questions=data;$('questions').innerHTML=questions.map((q,i)=>question(q,i)).join('');questions.forEach((q,i)=>bind(q,i))}
function question(q,i){let h='<div class="q"><div class="qtitle">Soal '+(i+1)+'<br>'+q.question+'</div>';if(q.type==='multiple_choice'||q.type==='multiple_choice_complex')h+=q.options.map(o=>'<label class="opt"><input type="'+(q.type==='multiple_choice'?'radio':'checkbox')+'" name="q'+i+'" value="'+o.key+'">'+o.key+'. '+o.text+'</label>').join('');else if(q.type==='true_false')h+='<label class="opt"><input type="radio" name="q'+i+'" value="B"> Benar</label><label class="opt"><input type="radio" name="q'+i+'" value="S"> Salah</label>';else if(q.type==='true_false_table')h+='<table class="table"><tr><th>Pernyataan</th><th>Benar</th><th>Salah</th></tr>'+q.rows.map((r,j)=>'<tr><td>'+r.text+'</td><td><input type="radio" name="t'+i+'_'+j+'" value="B"></td><td><input type="radio" name="t'+i+'_'+j+'" value="S"></td></tr>').join('')+'</table>';else if(q.type==='matching')h+=q.leftItems.map((x,j)=>'<label>'+x.text+' <select name="m'+i+'_'+j+'"><option value="">Pilih</option>'+q.rightItems.map(y=>'<option value="'+y.id+'">'+y.id+' - '+y.text+'</option>').join('')+'</select></label><br>').join('');else if(q.type==='essay')h+='<textarea name="e'+i+'" rows="5" placeholder="'+q.placeholder+'"></textarea>';return h+'</div>'}
function bind(q,i){document.querySelectorAll('[name="q'+i+'"]').forEach(x=>x.onchange=()=>answers[i]=q.type==='multiple_choice_complex'?[...document.querySelectorAll('[name="q'+i+'"]:checked')].map(y=>y.value):x.value);if(q.type==='true_false_table')q.rows.forEach((r,j)=>document.querySelectorAll('[name="t'+i+'_'+j+'"]').forEach(x=>x.onchange=()=>answers[i]=q.rows.map((_,k)=>document.querySelector('[name="t'+i+'_'+k+'"]:checked')?.value||'')));if(q.type==='matching')q.leftItems.forEach((_,j)=>document.querySelector('[name="m'+i+'_'+j+'"]').onchange=()=>answers[i]=q.leftItems.map((__,k)=>document.querySelector('[name="m'+i+'_'+k+'"]').value));if(q.type==='essay')document.querySelector('[name="e'+i+'"]').oninput=e=>answers[i]=e.target.value)}
function submitExam(){clearInterval(timerId);const name=localStorage.getItem('examName'),kelas=localStorage.getItem('examClass');$('exam').classList.remove('active');$('result').classList.add('active');$('result').innerHTML='<p>Menyimpan jawaban...</p>';google.script.run.withSuccessHandler(r=>{if(!r.success){$('result').innerHTML='<div class="error">'+r.error+'</div>';return}$('result').innerHTML='<div class="score">'+r.score+'/'+r.total+'</div><p>Nilai: '+r.percentage+'%</p><button class="btn" onclick="location.reload()">Selesai</button>'}).withFailureHandler(e=>{$('result').innerHTML='<div class="error">'+(e.message||e)+'</div>'}).submitAnswers(kelas,name,questions.map((q,i)=>answers[i]||''))}
</script></body></html>
